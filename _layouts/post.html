<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} – Unterm Nordlicht</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
  <nav class="nav-left">
    <button class="menu-button" aria-expanded="false" aria-controls="menu-panel">
      MENÜ <span class="chev">▾</span>
    </button>
    <div id="menu-panel" class="menu-panel" role="menu">
  <a role="menuitem" href="/" class="active">Startseite</a>
  <a role="menuitem" href="/ueber-uns.html">Über uns</a>
  <a role="menuitem" href="/blog.html">Blog</a>
  <a role="menuitem" href="/kontakt.html">Kontakt</a>
</div>
  </nav>
  <div class="brand">
    <h1><a href="/">untermnordlicht</a></h1>
    <p class="motto">einfach leben, tief fühlen</p>
  </div>
  <div class="nav-right socials">
    <!-- Instagram -->
    <a class="social-link" href="https://instagram.com/untermnordlicht" target="_blank" rel="noopener" aria-label="Instagram">
      <span class="icon-badge">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="3.5" y="3.5" width="17" height="17" rx="4.5" ry="4.5" fill="none" stroke="var(--forest)" stroke-width="2"/>
          <circle cx="12" cy="12" r="4.2" fill="none" stroke="var(--forest)" stroke-width="2"/>
          <circle cx="17.3" cy="6.7" r="1.2" fill="var(--forest)"/>
        </svg>
      </span>
    </a>
    <!-- Pinterest (grüner Kreis + ivory P) -->
    <a class="social-link" href="https://pinterest.com/untermnordlicht" target="_blank" rel="noopener" aria-label="Pinterest">
      <span class="icon-badge">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="12" fill="var(--forest)"></circle>
          <path fill="var(--ivory)" d="M12 2C6.48 2 2 6.48 2 12c0 4.2 2.67 7.8 6.45 9.18-.09-.78-.17-1.97.04-2.82.18-.76 1.16-4.84 1.16-4.84s-.29-.58-.29-1.43c0-1.34.78-2.35 1.75-2.35.83 0 1.23.62 1.23 1.36 0 .83-.53 2.07-.8 3.22-.23.96.48 1.75 1.42 1.75 1.7 0 3.01-1.8 3.01-4.4 0-2.3-1.66-3.91-4.03-3.91-2.75 0-4.37 2.06-4.37 4.19 0 .83.32 1.72.73 2.21.08.1.09.19.07.29-.08.32-.26 1.01-.3 1.15-.05.18-.15.22-.35.13-1.3-.61-2.1-2.52-2.1-4.06 0-3.3 2.4-6.34 6.93-6.34 3.64 0 6.47 2.6 6.47 6.07 0 3.62-2.28 6.54-5.45 6.54-1.07 0-2.07-.56-2.41-1.22l-.66 2.53c-.24.93-.88 2.09-1.31 2.8.99.31 2.03.47 3.11.47 5.52 0 10-4.48 10-10S17.52 2 12 2z"/>
      </span>
    </a>
  </div>
</header>

  <section class="hero" style="--hero:url('{{ page.image | default: site.default_image }}')">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h2 class="hero-title">{{ page.title }}</h2>
      {% if page.date %}<p class="hero-sub">{{ page.date | date: "%d.%m.%Y" }}</p>{% endif %}
    </div>
  </section>

  <main id="inhalt">
    <article class="wrap fade-in" style="max-width:68ch; margin:2rem auto;">
  {{ content }}
</article>
  </main>

  <!-- Kommentarbereich -->
  <section id="comments" class="wrap" style="max-width: 800px; margin: 3rem auto; text-align: left;">
    <h2 style="font-size: 1.4rem; color: var(--forest); margin-bottom: 1rem;">Kommentare</h2>

    <div id="cusdis_thread"
         data-host="https://cusdis.com"
         data-app-id="15bfca06-3706-4733-b51e-4c9477acce6f"
         data-page-id="{{ page.url }}"
         data-page-url="https://untermnordlicht.de{{ page.url }}"
         data-page-title="{{ page.title }}">
    </div>

    <script async defer src="https://cusdis.com/js/widget/lang/de.js"></script>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p class="copyright">© 2025 untermnordlicht</p>
      <span class="version">v1.0.3</span>
    </div>
  </footer>

  <script src="{{ '/script.js' | relative_url }}" defer></script>
</body>
</html>
